@let user$ = user();
@let userInitial$ = userInitial();

<div class="marker">
  <div [class]="userClasses()">
    @if (user$?.avatar_url) {
      <img
        class="image"
        [alt]="userInitial$"
        [src]="user$.avatar_url" />
    } @else {
      <div class="initial">{{ userInitial$ }}</div>
    }
  </div>
</div>
