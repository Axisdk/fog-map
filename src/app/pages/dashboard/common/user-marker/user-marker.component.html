@let userValue$ = user.value();
@let userLoading$ = user.loading();
@let userInitial$ = userInitial();

<div [class]="markerClass()">
  @if (userValue$?.avatar_url) {
    <img
      class="image"
      [alt]="userInitial$"
      [src]="userValue$.avatar_url" />
  } @else {
    <div class="initial">{{ userInitial$ }}</div>
  }
</div>
