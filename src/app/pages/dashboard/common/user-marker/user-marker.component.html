@let user$ = user();
@let userInitial$ = userInitial();
@let geolocation$ = geolocation();

<div [class]="markerClass()">
  <div [class]="userClasses()">
    @if (user$?.avatar_url) {
      <img
        class="image"
        [alt]="userInitial$"
        [src]="user$.avatar_url" />
    } @else {
      <div class="initial">{{ userInitial$ }}</div>
    }
  </div>

  <div class="accuracy" [style]="{ '--accuracy': (calculateAccuracy(geolocation$?.accuracy) ?? 0) + 'px' }"></div>
</div>
