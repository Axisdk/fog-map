<div class="zoom-controller">
  <button
    class="btn"
    type="button"
    aria-label="Приблизить"
    [disabled]="isMaxZoom()"
    (click)="updateZoom(1)"
  >
    +
  </button>
  <div class="divider"></div>
  <button
    class="btn"
    type="button"
    aria-label="Отдалить"
    [disabled]="isMinZoom()"
    (click)="updateZoom(-1)"
  >
    -
  </button>
</div>
