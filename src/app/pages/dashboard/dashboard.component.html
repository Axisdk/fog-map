<div class="dashboard">
<!--  <app-sidebar />-->

  @let mapConfig$ = mapConfig();
  @let geolocation$ = geolocation();

  @if (mapConfig$) {
    <mgl-map
      class="map"
      [mapStyle]="mapConfig$.mapStyle"
      [zoom]="mapConfig$.zoom"
      [fadeDuration]="mapConfig$.fadeDuration"
      [center]="mapCenter()"
      [hash]="mapConfig$.hash"
      [rollEnabled]="mapConfig$.rollEnabled"
      movingMethod="flyTo"
      (mapDragStart)="updateMapConfig({ marker_following: false })"
    >
      @if (geolocation$) {
        <mgl-marker [scale]="2" [lngLat]="{ lng: geolocation$?.coordinates?.longitude, lat: geolocation$?.coordinates?.latitude }">
          <app-user-marker [geolocation]="geolocation$" />
        </mgl-marker>
      }
    </mgl-map>
  }
  @if (!geolocation$) {
    <div class="geolocation-loading">Определяем местоположение…</div>
  }

  <div class="controllers">
    <app-marker-follow [mapConfig]="mapConfig$" />
    <app-zoom-controller [mapConfig]="mapConfig$" />
  </div>
</div>
